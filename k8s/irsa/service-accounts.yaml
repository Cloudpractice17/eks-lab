# WHY service account annotation:
# The annotation eks.amazonaws.com/role-arn is the trigger that tells
# the EKS Pod Identity Webhook to inject the OIDC token into the pod.
# Without this annotation, the pod uses the node's IAM role instead.
#
# IMPORTANT: After terraform apply outputs the role ARNs, replace the
# REPLACE-ME placeholders below with the actual ARN values, then apply
# these manifests with: kubectl apply -f k8s/irsa/

---
# Jenkins namespace (if not already created by Helm)
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
  labels:
    # GAP 5 — Pod Security Standards: Baseline profile blocks
    # privilege escalation, host path mounts, and privileged containers
    # without breaking legitimate workloads like Jenkins.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
  annotations:
    # Replace with the jenkins_role_arn from `terraform output`
    eks.amazonaws.com/role-arn: "REPLACE-ME-jenkins-role-arn"
    # WHY token-expiration-seconds:
    # Default OIDC token validity is 86400s (24h). Shorter expiry
    # means a leaked token is valid for a smaller window.
    eks.amazonaws.com/token-expiration-seconds: "3600"

---
# Argo CD namespace
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Patch the existing Argo CD server service account with the IRSA annotation
# Apply AFTER Argo CD is installed (argocd-server SA must already exist)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # Replace with the argocd_role_arn from `terraform output`
    eks.amazonaws.com/role-arn: "REPLACE-ME-argocd-role-arn"
    eks.amazonaws.com/token-expiration-seconds: "3600"
