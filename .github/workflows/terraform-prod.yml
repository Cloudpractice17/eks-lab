# PROD PIPELINE — stricter than dev
# ─────────────────────────────────────────────────────────────────────
# Same flow as dev BUT:
# - Only triggers manually (workflow_dispatch) or on explicit prod tag
# - Requires approval from a DIFFERENT GitHub Environment ("prod")
#   which should have more restrictive reviewers than dev
# - Plan output is always posted as a summary before apply
# - Apply uses the saved plan file — never a fresh plan
#
# WHY manual trigger only for prod:
# Every push to main should NOT automatically trigger a prod apply.
# Prod infra changes should be a conscious decision, not a side effect
# of merging a feature branch.

name: Terraform — Prod Environment

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for this prod apply (for audit log)"
        required: true
        type: string

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_DIR: environments/prod
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  validate:
    name: Validate Prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: environments/prod
          config_file: cicd/checkov/.checkov.yaml
          soft_fail: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

  plan:
    name: Plan Prod
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
        continue-on-error: true

      # Post plan as a workflow summary for the approver to review
      - name: Write plan to workflow summary
        run: |
          echo "## Prod Terraform Plan" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Show plan</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${{ env.TF_DIR }}/plan-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 3

  # WHY environment: prod with a separate secret AWS_ROLE_ARN_PROD:
  # Prod uses a different IAM role than dev. Even if the dev role is
  # compromised, it cannot assume the prod role. The prod environment
  # in GitHub requires approval from senior engineers before this
  # job runs — configure that in Repo Settings → Environments → prod.
  apply:
    name: Apply Prod
    runs-on: ubuntu-latest
    needs: plan
    environment: prod   # ← PROD APPROVAL GATE — stricter reviewers

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: ${{ env.TF_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan

      - name: Show outputs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output
