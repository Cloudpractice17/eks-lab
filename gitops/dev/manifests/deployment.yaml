---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myapp-dev
  labels:
    app: myapp
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  strategy:
    # WHY RollingUpdate: replaces pods one at a time so there's always
    # at least one pod serving traffic during a deploy. Zero downtime.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          # Jenkins updates this line via sed on every build
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/eks-lab/myapp:latest
          ports:
            - containerPort: 8080
          # WHY readinessProbe: Kubernetes won't send traffic to a new
          # pod until this passes. Prevents the load balancer from
          # routing requests to a pod that hasn't finished starting.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          # WHY livenessProbe: if the app locks up (running but not
          # responding), Kubernetes restarts the pod automatically.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: myapp-dev
spec:
  selector:
    app: myapp
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
  namespace: myapp-dev
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - host: myapp.eks.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapp
                port:
                  number: 80
